<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Salva Carteira - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">💰 Salva Carteira</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/transacoes">Transações</a></li>
                    <li class="nav-item"><a class="nav-link" href="/categorias">Categorias</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-body-emphasis">Resumo Financeiro</h1>
            <p class="lead text-muted">Acompanhe suas receitas, despesas e saldo atual.</p>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="card text-white bg-success h-100 shadow">
                    <div class="card-header bg-success border-success">Total de Receitas</div>
                    <div class="card-body">
                        <h2 class="card-title display-6" th:text="'R$ ' + ${totalReceitas}">R$ 0.00</h2>
                        <p class="card-text opacity-75">Entradas confirmadas</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-white bg-danger h-100 shadow">
                    <div class="card-header bg-danger border-danger">Total de Despesas</div>
                    <div class="card-body">
                        <h2 class="card-title display-6" th:text="'R$ ' + ${totalDespesas}">R$ 0.00</h2>
                        <p class="card-text opacity-75">Saídas confirmadas</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-white bg-primary h-100 shadow">
                    <div class="card-header bg-primary border-primary">Saldo Atual</div>
                    <div class="card-body">
                        <h2 class="card-title display-6" th:text="'R$ ' + ${saldo}">R$ 0.00</h2>
                        <p class="card-text opacity-75">Balanço geral</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <a href="/transacoes/nova" class="btn btn-primary btn-lg px-4 gap-3">Nova Transação</a>
            <a href="/transacoes" class="btn btn-outline-secondary btn-lg px-4">Ver Histórico</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
