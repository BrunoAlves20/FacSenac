<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nova Transação - Salva Carteira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">💰 Salva Carteira</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/transacoes">Transações</a></li>
                    <li class="nav-item"><a class="nav-link" href="/categorias">Categorias</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card shadow">
                    <div class="card-header bg-primary text-white p-3">
                        <h4 class="mb-0">📝 Cadastrar Transação</h4>
                    </div>
                    
                    <div class="card-body p-4">
                        <form th:action="@{/transacoes}" th:object="${transacao}" method="POST">
                            
                            <div class="mb-3">
                                <label for="descricao" class="form-label fw-bold">Descrição</label>
                                <input type="text" th:field="*{descricao}" id="descricao" class="form-control" 
                                       placeholder="Ex: Almoço, Salário, Uber..." required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="valor" class="form-label fw-bold">Valor (R$)</label>
                                    <div class="input-group">
                                        <span class="input-group-text">R$</span>
                                        <input type="number" step="0.01" th:field="*{valor}" id="valor" class="form-control" required>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="data" class="form-label fw-bold">Data</label>
                                    <input type="date" th:field="*{data}" id="data" class="form-control" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="tipo" class="form-label fw-bold">Tipo</label>
                                    <select th:field="*{tipo}" id="tipo" class="form-select">
                                        <option value="DESPESA">🔴 Despesa</option>
                                        <option value="RECEITA">🟢 Receita</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <label for="categoria" class="form-label fw-bold">Categoria</label>
                                    <select th:field="*{categoria}" id="categoria" class="form-select" required>
                                        <option value="">Selecione...</option>
                                        <option th:each="cat : ${categorias}" 
                                                th:value="${cat.id}" 
                                                th:text="${cat.nome}"></option>
                                    </select>
                                    <div class="form-text">
                                        Não achou? <a href="/categorias">Crie uma nova categoria</a>.
                                    </div>
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="/transacoes" class="btn btn-outline-secondary me-md-2">Cancelar</a>
                                <button type="submit" class="btn btn-success px-4">Salvar Transação</button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
