<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Salva Carteira - Categorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
</head>
<body>

    <header th:fragment="header" class="bg-light p-3 mb-4 border-bottom">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-dark text-decoration-none">
                    <span class="fs-4">Salva Carteira</span>
                </a>

                <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0 ms-4">
                    <li><a href="#" class="nav-link px-2 link-secondary">Dashboard</a></li>
                    <li><a href="/transacoes" class="nav-link px-2 link-dark">Transações</a></li>
                    <li><a href="/categorias" class="nav-link px-2 link-dark">Categorias</a></li>
                    <li><a href="#" class="nav-link px-2 link-dark">Relatórios</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main class="container">
        
        <h1 class="mb-4">Gestão de Categorias</h1>

        <form th:action="@{/categorias}" th:object="${novaCategoria}" method="POST" class="mb-5 p-4 border rounded bg-light">
            <div class="row g-3">
                <div class="col-md-5">
                    <label for="nome" class="form-label">Nome da Categoria</label>
                    <input type="text" th:field="*{nome}" class="form-control" id="nome" placeholder="Ex: Alimentação" required>
                </div>
                <div class="col-md-5">
                    <label for="descricao" class="form-label">Descrição (Opcional)</label>
                    <input type="text" th:field="*{descricao}" class="form-control" id="descricao" placeholder="Ex: Gastos com comida">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Salvar</button>
                </div>
            </div>
        </form>

        
        <h2 class="mb-3">Categorias Cadastradas</h2>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th style="width: 15%;">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="categoria : ${listaCategorias}">
                    <td th:text="${categoria.nome}">Alimentação</td>
                    <td th:text="${categoria.descricao}">Gastos com comida</td>
                    <td>
                        <a href="#" class="btn btn-sm btn-warning">Editar</a>
                        <a href="#" class="btn btn-sm btn-danger">Excluir</a>
                    </td>
                </tr>
            </tbody>
        </table>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>
</body>
</html>
