<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Transações - Salva Carteira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">💰 Salva Carteira</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/transacoes">Transações</a></li>
                    <li class="nav-item"><a class="nav-link" href="/categorias">Categorias</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-secondary">Histórico de Transações</h2>
            <a href="/transacoes/nova" class="btn btn-primary shadow-sm">
                + Nova Transação
            </a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col" class="ps-4">Data</th>
                            <th scope="col">Descrição</th>
                            <th scope="col">Categoria</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Valor</th>
                            <th scope="col" class="text-end pe-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${listaTransacoes}">
                            <td class="ps-4" th:text="${#temporals.format(t.data, 'dd/MM/yyyy')}"></td>
                            <td th:text="${t.descricao}" class="fw-semibold"></td>
                            <td>
                                <span class="badge text-bg-secondary bg-opacity-75" th:text="${t.categoria.nome}">Categoria</span>
                            </td>
                            <td>
                                <span th:text="${t.tipo}" 
                                      th:class="${t.tipo.name() == 'RECEITA'} ? 'badge bg-success' : 'badge bg-danger'">
                                </span>
                            </td>
                            <td th:text="'R$ ' + ${t.valor}"></td>
                            <td class="text-end pe-4">
                                <a th:href="@{/transacoes/deletar/{id}(id=${t.id})}" 
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Tem certeza que deseja excluir esta transação?')">Excluir</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listaTransacoes)}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <h5>Nenhuma transação encontrada 😕</h5>
                                <p>Clique em "Nova Transação" para começar.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
