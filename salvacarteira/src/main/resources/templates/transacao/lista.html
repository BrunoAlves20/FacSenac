<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Categorias - Salva Carteira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">💰 Salva Carteira</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/transacoes">Transações</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/categorias">Categorias</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        <h2 class="text-secondary mb-4">Gestão de Categorias</h2>

        <div class="card shadow-sm mb-5">
            <div class="card-body">
                <h5 class="card-title text-primary mb-3">Nova Categoria</h5>
                <form th:action="@{/categorias}" th:object="${novaCategoria}" method="POST" class="row g-3 align-items-end">
                    <div class="col-md-5">
                        <label for="nome" class="form-label fw-bold">Nome</label>
                        <input type="text" th:field="*{nome}" class="form-control" id="nome" placeholder="Ex: Lazer" required>
                    </div>
                    <div class="col-md-5">
                        <label for="descricao" class="form-label fw-bold">Descrição</label>
                        <input type="text" th:field="*{descricao}" class="form-control" id="descricao" placeholder="Opcional">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-success w-100">Salvar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col" class="ps-4">Nome</th>
                            <th scope="col">Descrição</th>
                            <th scope="col" class="text-end pe-4" style="width: 20%;">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="categoria : ${listaCategorias}">
                            <td class="ps-4 fw-semibold" th:text="${categoria.nome}">Nome</td>
                            <td th:text="${categoria.descricao}">Descricao</td>
                            <td class="text-end pe-4">
                                <a th:href="@{/categorias/deletar/{id}(id=${categoria.id})}" 
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Tem certeza que deseja excluir esta categoria?')">
                                   Excluir
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listaCategorias)}">
                            <td colspan="3" class="text-center py-4 text-muted">
                                Nenhuma categoria cadastrada.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
